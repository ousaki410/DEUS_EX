[package]
name = "deusex-audio"
version = "0.1.0"
edition = "2021"
description = "Deus Ex Native - deusex-audio"
license = "MIT"

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
openal = { workspace = true, optional = true }
