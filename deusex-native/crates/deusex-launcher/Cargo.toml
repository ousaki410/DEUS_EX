[package]
name = "deusex-launcher"
version = "0.1.0"
edition = "2021"
description = "Deus Ex Native - deusex-launcher"
license = "MIT"

[[bin]]
name = "deusex-launcher"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true, optional = true }
pollster = { workspace = true }
raw-window-handle = { workspace = true }

# Optional GUI backend (requires system SDL3 dev library).
# OpenAL audio is optional; enable `audio` feature if libopenal-dev is installed.
deusex-input = { path = "../deusex-input", optional = true }
deusex-renderer = { path = "../deusex-renderer", optional = true }
deusex-audio = { path = "../deusex-audio", optional = true }
deusex-game = { path = "../deusex-game", optional = true }

[features]
default = []
# 启用后：winit 窗口/输入 + wgpu 渲染设备。音频保持占位（无 OpenAL）。
#   cargo run -p deusex-launcher --features gui
# 如系统已安装 libopenal-dev，可额外启用 audio 以获得真实音频后端：
#   cargo run -p deusex-launcher --features gui,audio
gui = ["winit", "deusex-input", "deusex-renderer", "deusex-game"]
audio = ["deusex-audio/openal"]
