name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Test on multiple platforms
  test:
    name: Test (Rust ${{ matrix.rust-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust-version: ["stable", "nightly"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (nightly)
        if: matrix.rust-version == 'nightly'
        run: rustup update nightly

      - name: Install Rust (stable)
        if: matrix.rust-version == 'stable'
        run: rustup update stable

      - name: Set default toolchain
        shell: bash
        run: |
          if [ "${{ matrix.rust-version }}" = "nightly" ]; then
            rustup default nightly
          else
            rustup default stable
          fi

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ matrix.os }}-${{ matrix.rust-version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-${{ matrix.os }}-${{ matrix.rust-version }}-
            ${{ runner.os }}-cargo-build-target-${{ matrix.os }}-
            ${{ runner.os }}-cargo-build-

      - name: Run Rustfmt
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --release

      - name: Run examples
        run: cargo run --example run_script -- --help

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.rust-version }}
          path: |
            target/debug/debug/*
            target/debug/release/*

  # Test for GUI feature (requires system deps)
  test-gui:
    name: Test GUI Feature
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SDL3 and OpenAL
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libsdl3-dev libopenal-dev

      - name: Install Rust
        run: rustup update nightly

      - name: Set default toolchain
        shell: bash
        run: rustup default nightly

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-gui-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gui-

      - name: Build with GUI feature
        run: cargo build --release --features gui

      - name: Run GUI test
        run: cargo run --release --features gui -- -h

  # Check for code coverage
  coverage:
    name: Coverage (Nightly)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly toolchain
        run: rustup update nightly

      - name: Set default toolchain
        run: rustup default nightly

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run coverage
        run: cargo tarpaulin --out Xml --output-dir ./coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/cobertura.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Build on multiple targets
  build:
    name: Build (Target ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-gnu
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ matrix.target }}-
            ${{ runner.os }}-cargo-build-

      - name: Build project
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/deusex-native
            target/${{ matrix.target }}/release/deusex-launcher

  # Lint report
  lint:
    name: Lint Report
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup update stable

      - name: Set default toolchain
        run: rustup default stable

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -- -D warnings > clippy-report.log 2>&1

      - name: Save clippy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clippy-report
          path: clippy-report.log

  # Security audit
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run audit
        run: cargo audit --deny warnings

  # Documentation check
  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup update stable

      - name: Set default toolchain
        run: rustup default stable

      - name: Update documentation
        run: cargo doc --no-deps

      - name: Check for broken docs
        run: cargo doc --no-deps --document-private-items

      - name: Upload docs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation
          path: target/doc